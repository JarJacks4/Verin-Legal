<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Verin">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- The app sits behind sign-in; the marketing site is what gets indexed. -->
  <meta name="robots" content="noindex" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Verin — Evidence Record</title>
  <meta name="description" content="Verin is the evidence record for family-law firms. Every message, photo and video your client sends is hashed, timestamped and read the moment it arrives." />
  <link rel="canonical" href="https://app.verinlegal.com/" />

  <!-- Link previews (email, Slack, LinkedIn, iMessage) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Verin" />
  <meta property="og:url" content="https://app.verinlegal.com/" />
  <meta property="og:title" content="Verin — Evidence Record" />
  <meta property="og:description" content="Every message, photo and video your client sends — hashed, timestamped and read the moment it arrives." />
  <meta property="og:image" content="https://app.verinlegal.com/og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Verin — Evidence Record" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Verin — Evidence Record" />
  <meta name="twitter:description" content="Every message, photo and video your client sends — hashed, timestamped and read the moment it arrives." />
  <meta name="twitter:image" content="https://app.verinlegal.com/og-card.png" />

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFAF8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0B1622">

  <link rel="manifest" href="manifest.json">

  <!-- Launch splash (painted before Flutter boots; see lib/verin_app/shell/splash.dart) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@700&display=block" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0B1622; }
    #verin-splash {
      position: fixed; inset: 0; z-index: 9999; background: #0B1622;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 420ms cubic-bezier(.4,0,.2,1);
    }
    #verin-splash.out { opacity: 0; pointer-events: none; }
    #verin-splash svg { width: 88px; height: 88px; display: block; overflow: visible; }
    #verin-splash .b {
      transform-box: fill-box; transform-origin: 50% 50%;
      opacity: 0; transform: translateY(40px) scaleX(.7);
      animation: verin-bar 620ms cubic-bezier(.22,1,.36,1) forwards;
    }
    #verin-splash .b4 { animation-delay: 60ms; }
    #verin-splash .b3 { animation-delay: 180ms; }
    #verin-splash .b2 { animation-delay: 300ms; }
    #verin-splash .b1 { animation-delay: 420ms; }
    #verin-splash .b0 { animation-delay: 540ms; }
    #verin-splash .name {
      margin-top: 28px; font-family: 'Spectral', Georgia, serif; font-weight: 700;
      font-size: 34px; line-height: 1.2; letter-spacing: .3px; color: #F6F3EE;
      opacity: 0; transform: translateY(8px);
      animation: verin-name 600ms cubic-bezier(.22,1,.36,1) 620ms forwards;
    }
    @keyframes verin-bar { to { opacity: 1; transform: none; } }
    @keyframes verin-name { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      #verin-splash .b, #verin-splash .name { animation-duration: 1ms; animation-delay: 0ms; }
    }
  </style>
  
</head>
<body>
  <div id="verin-splash" aria-label="Verin Legal" role="img">
    <svg viewBox="0 0 550 550" aria-hidden="true"><rect class="b b0" x="173.5" y="0" width="203" height="72" rx="18" fill="#0E6E7D"/><rect class="b b1" x="124" y="119" width="302" height="72" rx="18" fill="#F6F3EE"/><rect class="b b2" x="77" y="238" width="396" height="72" rx="18" fill="#F6F3EE"/><rect class="b b3" x="38.5" y="357" width="473" height="72" rx="18" fill="#F6F3EE"/><rect class="b b4" x="0" y="476" width="550" height="72" rx="18" fill="#F6F3EE"/></svg>
    <div class="name">Verin Legal</div>
  </div>
  <script>
    // Flutter draws the same splash underneath, then flies the mark into place.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('verin-splash');
      if (!el) return;
      setTimeout(function () {
        el.classList.add('out');
        setTimeout(function () { el.remove(); }, 500);
      }, 450);
    });
  </script>
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
